{% extends 'grader/base.html' %}
{% block content %}
<h1>確定刪除{{ label }}？</h1>
<p>這會一併刪除 {% if submissions %}{{ submissions }} 份繳交與 {% endif %}{{ scores }} 筆人工分數，無法復原。</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="danger-btn">確定刪除</button>
  <a href="{% url 'grader:exam_settings' exam.id %}">取消</a>
</form>
{% endblock %}
